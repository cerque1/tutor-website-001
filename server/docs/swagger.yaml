            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Удалить услугу
      tags:
      - Services
    get:
      description: Получает сервис по id
      parameters:
      - description: ID сервиса
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Получить сервис
      tags:
      - Services
    patch:
      consumes:
      - application/json
      description: Частичное изменение данных сервиса
      parameters:
      - description: ID услуги
        in: path
        name: id
        required: true
        type: integer
      - description: Данные для изменения
