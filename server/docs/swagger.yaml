        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Изменить сервис
      tags:
      - Services
  /services/all:
    get:
      consumes:
      - application/json
      description: Получить весь список услуг
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Получить список услуг
      tags:
      - Services
  /users:
