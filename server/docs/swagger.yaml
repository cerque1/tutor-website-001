      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Создать услугу
      tags:
      - Services
  /services/{id}:
    delete:
      parameters:
      - description: ID услуги
